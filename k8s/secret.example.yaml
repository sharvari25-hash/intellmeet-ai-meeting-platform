# TEMPLATE ONLY - not part of kustomization.yaml, and never fill it in and
# commit it. Create the real Secret from the command line (values stay out of
# git and out of shell history if read from files):
#
#   kubectl -n intellmeet create secret generic intellmeet-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=MONGODB_URI='mongodb+srv://USER:PASSWORD@CLUSTER/intellmeet' \
#     --from-literal=REDIS_URL='rediss://default:PASSWORD@HOST:6379' \
#     --from-literal=GEMINI_API_KEY='...'
#
# Optional keys (omit any you do not use): CLOUDINARY_CLOUD_NAME,
# CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET, TURN_URLS, TURN_USERNAME,
# TURN_CREDENTIAL, GROQ_API_KEY.
apiVersion: v1
kind: Secret
metadata:
  name: intellmeet-secrets
  namespace: intellmeet
  labels:
    app.kubernetes.io/name: intellmeet
    app.kubernetes.io/part-of: intellmeet
type: Opaque
stringData:
  JWT_SECRET: replace-with-64-hex-characters-from-openssl-rand-hex-32
  MONGODB_URI: mongodb+srv://USER:PASSWORD@CLUSTER.mongodb.net/intellmeet
  REDIS_URL: rediss://default:PASSWORD@HOST:6379
  GEMINI_API_KEY: ''
