# Scales the API on CPU. Needs metrics-server in the cluster (kind does not
# ship it; see docs/kubernetes.md).
#
# Why the API scales horizontally without extra work: Socket.io broadcasts go
# through the Redis adapter to every pod, rate limits and presence live in
# Redis, and BullMQ hands each AI job to exactly one worker. What a pod keeps
# to itself is the socket connection, which is why the Ingress uses sticky
# sessions.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: intellmeet-server
  namespace: intellmeet
  labels:
    app.kubernetes.io/name: intellmeet
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: intellmeet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: intellmeet-server
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Of the 100m CPU request.
          averageUtilization: 70
  behavior:
    scaleDown:
      # Scaling down drops the sockets on the removed pod (clients reconnect
      # to another one), so wait for load to stay low before doing it.
      stabilizationWindowSeconds: 300
