# A one-node kind cluster for validating the manifests locally.
#   kind create cluster --config k8s/local/kind-config.yaml
# Port 80 of the node (the ingress controller) is published on the host as
# 8081, so the app is at http://localhost:8081 and nothing clashes with the
# dev servers on 5000/5173.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: intellmeet
nodes:
  - role: control-plane
    # ingress-nginx's kind manifest schedules its controller on this label.
    labels:
      ingress-ready: 'true'
    extraPortMappings:
      - containerPort: 80
        hostPort: 8081
        protocol: TCP
