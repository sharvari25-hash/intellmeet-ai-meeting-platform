# Render Blueprint for the IntellMeet API: one free web service built from
# server/Dockerfile, and one free Key Value instance (Redis-compatible) on
# Render's private network. The client is on Vercel (client/vercel.json).
#
# Secrets are `sync: false`: Render asks for them once, when the Blueprint is
# first created, and never reads them from this file (it holds no real
# values). Later syncs leave them alone, so the Render dashboard is where
# they live and where they are rotated. See docs/deployment.md.
#
# Reference: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: intellmeet-api
    runtime: docker
    plan: free
    # Beside the Atlas cluster (AWS ap-southeast-1) and the Key Value below.
    # Cannot be changed after creation.
    region: singapore
    # Built from the repository root: the server depends on `shared/` and the
    # root lockfile.
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    # 200 whenever the process can answer; Mongo and Redis are reported in the
    # body, not failed on (restarting the API does not fix a database outage).
    healthCheckPath: /api/health
    # Deploy a commit only once all of its GitHub checks (CI, image builds)
    # have passed. Manual deploys from the dashboard still work at any time.
    autoDeployTrigger: checksPass
    # Only what goes into the image triggers a build: a docs or client-only
    # commit must not spend build minutes or restart the service.
    buildFilter:
      paths:
        - server/**
        - shared/**
        - package.json
        - package-lock.json
        - tsconfig.base.json
        - .dockerignore
    envVars:
      # --- Runtime -----------------------------------------------------------
      - key: NODE_ENV
        value: production
      # The free plan has 512 MB. Capping V8's heap below that leaves room for
      # ffmpeg (split long recordings) and native memory, so a heavy moment
      # makes Node collect garbage instead of the container being killed.
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      # Background workers are a paid service type: the AI queue's worker runs
      # inside the web process.
      - key: RUN_WORKER_IN_PROCESS
        value: 'true'
      - key: LOG_LEVEL
        value: info
      # PORT is injected by Render; the server reads it.

      # --- Where the web client is (the Vercel domain) -----------------------
      # Not secret. `sync: false` only until the Vercel project exists (it is
      # created after this service, whose URL it needs); then these become
      # plain values here.
      - key: CORS_ORIGINS
        sync: false
      - key: CLIENT_URL
        sync: false

      # --- Data stores ---------------------------------------------------------
      # Atlas M0 (Singapore). Secret: contains the database password.
      - key: MONGODB_URI
        sync: false
      # The Key Value instance below, over the private network. Wired by
      # Render, so it is never typed or seen.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: intellmeet-redis
          property: connectionString

      # --- Auth -------------------------------------------------------------------
      # A random 256-bit value (44 base64 characters), generated by Render
      # once and kept across deploys.
      - key: JWT_SECRET
        generateValue: true
      # The free plan has 0.1 CPU. At cost 12 a sign-in took 5-7 s there
      # (measured in the image capped at 0.1 CPU), and a few at once can starve
      # the health check. 10 is OWASP's floor for bcrypt and 4x cheaper. Seed
      # production with the same value: a hash keeps the cost it was made with.
      - key: BCRYPT_COST
        value: '10'

      # --- AI: Gemini with the fallback chain ---------------------------------
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.6-flash,gemini-3.7-flash,gemini-3.8-flash

      # --- Cloudinary (recordings; Render's disk is wiped on every deploy) ---
      # The cloud name is not secret, but it is asked for beside its key.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # --- TURN (Metered) ------------------------------------------------------
      # UDP and TCP on 80, UDP on 443, and TLS on 443 for networks that only
      # let HTTPS out. The URLs are public; the credential is not.
      - key: TURN_URLS
        value: turn:global.relay.metered.ca:80,turn:global.relay.metered.ca:80?transport=tcp,turn:global.relay.metered.ca:443,turns:global.relay.metered.ca:443?transport=tcp
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false

  # Redis for BullMQ, the Socket.io adapter, rate limits and caches. The free
  # plan has no command limit (Upstash's free 500K commands a month would run
  # out in about nine days on BullMQ's idle polling and the health checks
  # alone), but 25 MB, 50 connections and no persistence: a restart loses
  # queued AI jobs, which the housekeeping sweep then marks failed for Retry.
  - type: keyvalue
    name: intellmeet-redis
    plan: free
    region: singapore
    # BullMQ requires it: under memory pressure a write fails loudly instead of
    # a queued job being evicted without a trace. (The default is allkeys-lru.)
    maxmemoryPolicy: noeviction
    # No entries: reachable only over Render's private network, from services
    # in this region. No public endpoint, so no password to leak.
    ipAllowList: []
