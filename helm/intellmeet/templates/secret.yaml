{{- /*
Only for local clusters (secrets.create=true). In production reference a
Secret created outside Helm (secrets.existingSecret), so secret values are
never stored in a values file or in Helm's release history.
*/ -}}
{{- if .Values.secrets.create }}
{{- $values := .Values.secrets.values | default dict }}
{{- $fullname := include "intellmeet.fullname" . }}
{{- $mongo := $values.MONGODB_URI }}
{{- $redis := $values.REDIS_URL }}
{{- if .Values.localDatabases.enabled }}
{{- $mongo = $mongo | default (printf "mongodb://%s-mongo:27017/intellmeet" $fullname) }}
{{- $redis = $redis | default (printf "redis://%s-redis:6379" $fullname) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "intellmeet.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.values.JWT_SECRET is required (--set-string secrets.values.JWT_SECRET=$(openssl rand -hex 32))" $values.JWT_SECRET | quote }}
  MONGODB_URI: {{ required "secrets.values.MONGODB_URI is required unless localDatabases.enabled" $mongo | quote }}
  REDIS_URL: {{ required "secrets.values.REDIS_URL is required unless localDatabases.enabled" $redis | quote }}
  {{- range $key, $value := omit $values "JWT_SECRET" "MONGODB_URI" "REDIS_URL" }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
