apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "intellmeet.fullname" . }}
  labels:
    {{- include "intellmeet.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
  # With a separate worker Deployment, the API pods stop consuming the queue.
  RUN_WORKER_IN_PROCESS: {{ (not .Values.worker.enabled) | toString | quote }}
